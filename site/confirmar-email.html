<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B5D4B">
  <title>Confirmar e-mail · Pergunta Pública</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/session.js"></script>
</head>
<body class="auth-body">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <main id="main" class="auth-screen">
    <form id="confirm-form" class="auth-card auth-form" novalidate>
        <a class="auth-logo" href="chat.html" aria-label="Pergunta Pública — voltar ao chat"><span data-logo></span><span><strong>Pergunta</strong> Pública</span></a>
      <h1>Confirmar e-mail</h1>
      <p class="auth-sub">Enviamos um código de 6 números para <strong id="confirm-email">seu e-mail</strong>.</p>
        <div class="field"><label for="confirm-code">Código recebido</label>
        <input id="confirm-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <small class="hint" id="confirm-code-hint">Na demonstração, qualquer código de 6 números funciona.</small></div>
      <button class="button button-primary button-block" type="submit">Confirmar</button>
      <a id="resend-code" class="auth-back" href="#">Reenviar código</a>
      <a class="auth-back" href="login.html">Voltar ao login</a>
    </form>
  </main>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
